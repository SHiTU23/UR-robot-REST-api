# OnRobot RG6 model (ros/urdf/grippers/rg6.xacro): links, driving joint, limits, and the width table.
# How the cell DRIVES the gripper (pendant programs, registers) is in config/cell.yaml, section gripper.
xacro: rg6.xacro
name: OnRobot RG6
joint: rg6_finger_joint                 # driving joint; every other finger joint mimics it
hand_link: rg6_base_link                # held objects attach here
links: [rg6_base_link, rg6_left_outer_knuckle, rg6_left_inner_knuckle, rg6_left_inner_finger,
        rg6_right_outer_knuckle, rg6_right_inner_knuckle, rg6_right_inner_finger]
pad_links: [rg6_left_inner_finger, rg6_right_inner_finger]
closing_axis_in_mount: y                # the model's fingers close along its base y (mounted turned to tool0 x)
mount_offset_m: 0.0                     # the model's base link is its mounting face
max_width_m: 0.160                      # datasheet stroke 0-160 mm (the model reaches 159 mm, see the table)
min_force_n: 25.0                       # datasheet force range 25-120 N
max_force_n: 120.0
default_force_n: 40.0
# Computed from the model by tools/gripper_table.py (pad collision meshes): width = gap between the pads,
# tip = farthest pad point below the mount face. The fingertips are 55 mm deeper closed than fully open.
table:   # [joint value, width m (pad gap), tip depth m (farthest pad point below the mount face)]
