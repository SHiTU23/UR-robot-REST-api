# Robotiq 2F-85 on Robotiq's UR adapter plate (ros/urdf/grippers/robotiq_2f85.xacro): links, driving joint,
# limits, and the width table. Control on the real arm is not implemented yet (mock / simulated gripper only).
xacro: robotiq_2f85.xacro
name: Robotiq 2F-85
joint: robotiq_85_left_knuckle_joint    # 0 = open .. 0.8 = closed; every other finger joint mimics it
hand_link: robotiq_85_base_link
links: [ur_to_robotiq_link, robotiq_85_base_link, robotiq_85_left_knuckle_link, robotiq_85_right_knuckle_link,
        robotiq_85_left_finger_link, robotiq_85_right_finger_link, robotiq_85_left_inner_knuckle_link,
        robotiq_85_right_inner_knuckle_link, robotiq_85_left_finger_tip_link, robotiq_85_right_finger_tip_link]
pad_links: [robotiq_85_left_finger_tip_link, robotiq_85_right_finger_tip_link]
closing_axis_in_mount: x
mount_offset_m: 0.0                     # the adapter plate's flange side (the table's tip depth includes its 11 mm)
max_width_m: 0.085                      # datasheet stroke 85 mm (the model: 85.0 mm, see the table)
min_force_n: 20.0                       # datasheet grip force 20-235 N
max_force_n: 235.0
default_force_n: 40.0
# Computed from the model by tools/gripper_table.py, as for the RG6.
table:   # [joint value, width m (pad gap), tip depth m (farthest pad point below the mount face)]
